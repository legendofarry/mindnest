<!DOCTYPE html>
<html lang="en">

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Teraji is a web-first mental wellness workspace for students, staff, counselors, and institutions.">
  <meta name="theme-color" content="#0E9B90">
  <meta name="application-name" content="Teraji">
  <meta property="og:title" content="Teraji | Mental Wellness Support for Institutions">
  <meta property="og:description"
    content="Invite-ready onboarding, counselor workflows, live support rooms, and privacy-aware care journeys in one browser workspace.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://teraji.netlify.app/">
  <meta property="og:image" content="https://teraji.netlify.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Teraji | Mental Wellness Support for Institutions">
  <meta name="twitter:description"
    content="Invite-ready onboarding, counselor workflows, live support rooms, and privacy-aware care journeys in one browser workspace.">
  <meta name="twitter:image" content="https://teraji.netlify.app/icons/Icon-512.png">
  <link rel="canonical" href="https://teraji.netlify.app/">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="Teraji">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Teraji | Mental Wellness Support for Institutions</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --ink: #0b1f2a;
      --muted: #5a7587;
      --brand: #0e9b90;
      --brand-deep: #0a6f6a;
      --brand-soft: #b8f0e8;
      --bg-0: #f4faf9;
      --bg-1: #eaf6f4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Outfit", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg-0);
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow: hidden;
    }

    /* ---------- Ambient calm background ---------- */
    #mindnest-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden;
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(124, 244, 232, 0.28), transparent 60%),
        radial-gradient(900px 600px at 85% 90%, rgba(14, 155, 144, 0.18), transparent 60%),
        linear-gradient(180deg, #f7fcfb 0%, #eef7f5 100%);
      transition: opacity 600ms ease, transform 600ms ease;
    }

    #mindnest-loader.loader-hidden {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }

    .mindnest-loader-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0 20px;
    }

    .mindnest-loader-tags span {
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(215, 230, 238, 0.98);
      color: #315a74;
      font-size: 13px;
      font-weight: 700;
    }

    /* Floating ambient blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      pointer-events: none;
      will-change: transform;
    }

    .blob.b1 {
      width: 420px;
      height: 420px;
      left: -120px;
      top: -120px;
      background: radial-gradient(circle, #7cf4e8, transparent 70%);
      animation: drift1 18s ease-in-out infinite;
    }

    .blob.b2 {
      width: 520px;
      height: 520px;
      right: -160px;
      bottom: -160px;
      background: radial-gradient(circle, #a8ecd8, transparent 70%);
      animation: drift2 22s ease-in-out infinite;
    }

    .blob.b3 {
      width: 320px;
      height: 320px;
      left: 55%;
      top: 10%;
      background: radial-gradient(circle, #cdeff7, transparent 70%);
      animation: drift3 26s ease-in-out infinite;
    }

    @keyframes drift1 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(60px, 40px) scale(1.08);
      }
    }

    @keyframes drift2 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-50px, -30px) scale(1.06);
      }
    }

    @keyframes drift3 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-30px, 50px) scale(1.1);
      }
    }

    /* ---------- Card ---------- */
    .card {
      position: relative;
      width: min(560px, 100%);
      padding: 56px 44px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 30px 80px -30px rgba(10, 111, 106, 0.25),
        0 8px 24px -12px rgba(10, 111, 106, 0.15);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      text-align: center;
      animation: cardIn 900ms cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes cardIn {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(.98);
      }

      100% {
        opacity: 1;
        transform: none;
      }
    }

    /* ---------- Breathing orb ---------- */
    .orb-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
    }

    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(14, 155, 144, 0.25);
      animation: breathe 4.5s ease-in-out infinite;
    }

    .orb-ring.r2 {
      animation-delay: -1.5s;
      opacity: 0.6;
    }

    .orb-ring.r3 {
      animation-delay: -3s;
      opacity: 0.35;
    }

    @keyframes breathe {

      0%,
      100% {
        transform: scale(0.72);
        opacity: 0.0;
      }

      40% {
        opacity: 0.9;
      }

      50% {
        transform: scale(1.0);
      }

      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    .orb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .orb-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      z-index: 2;
      filter: drop-shadow(0 4px 12px rgba(14, 155, 144, 0.25));
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-4px) scale(1.04);
      }
    }

    @keyframes orbPulse {

      0%,
      100% {
        transform: scale(0.96);
      }

      50% {
        transform: scale(1.04);
      }
    }

    /* ---------- Brand ---------- */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      font-size: 15px;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp .8s .15s ease-out forwards;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 4px rgba(14, 155, 144, .15);
    }

    h1.title {
      font-family: "Outfit", "Segoe UI", system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(30px, 4.4vw, 42px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin: 4px 0 14px;
      color: var(--ink);
      opacity: 0;
      animation: fadeUp .9s .25s ease-out forwards;
    }

    h1.title em {
      font-style: italic;
      font-weight: 300;
      color: var(--brand-deep);
    }

    p.copy {
      margin: 0 auto 28px;
      max-width: 380px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp .9s .35s ease-out forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }


    /* ---------- Status ---------- */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--brand-deep);
      opacity: 0;
      animation: fadeUp .9s .55s ease-out forwards;
    }

    .loader-dots {
      display: inline-flex;
      gap: 5px;
    }

    .loader-dots span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--brand);
      animation: loaderBounce 1s infinite ease-in-out;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: .14s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: .28s;
    }

    @keyframes loaderBounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: .38;
      }

      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* ---------- Reduced motion ---------- */
    @media (prefers-reduced-motion: reduce) {

      .blob,
      .orb,
      .orb-ring,
      .status .dot,
      .card,
      .brand,
      .title,
      .copy,
      .status {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 24px;
        border-radius: 24px;
      }

      .orb-wrap {
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
      }

      .orb {
        width: 60px;
        height: 60px;
      }
    }
  </style>

  <script>
    window.addEventListener("flutter-first-frame", function () {
      var loader = document.getElementById("mindnest-loader");
      if (!loader) return;
      window.setTimeout(function () {
        loader.classList.add("loader-hidden");
        window.setTimeout(function () { loader.remove(); }, 600);
      }, 150);
    });
  </script>
</head>

<body>
  <div id="mindnest-loader" aria-live="polite" aria-label="Loading Teraji workspace">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <div class="card">
      <div class="orb-wrap" aria-hidden="true">
        <div class="orb-ring r1"></div>
        <div class="orb-ring r2"></div>
        <div class="orb-ring r3"></div>
        <div class="orb">
          <img class="orb-logo" src="assets/assets/MindNest-Logo.svg" alt="Teraji logo">
        </div>
      </div>

      <div class="brand">
        <span class="brand-dot"></span>
        <span>Teraji</span>
      </div>

      <h1 class="title">A calm space, <b style="color:rgb(14, 155, 143)">preparing for you.</b></h1>
      <div class="mindnest-loader-tags" aria-hidden="true">
        <span>Students</span>
        <span>Staff</span>
        <span>Counselors</span>
      </div>

      <div class="status">
        <span>opening your workspace</span>
        <span class="loader-dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    </div>
  </div>

  <script src="passkeys_bundle.js" type="application/javascript"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
